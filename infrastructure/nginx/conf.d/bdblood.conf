# ─────────────────────────────────────────────────────────────────────────
# Replace YOUR_DOMAIN.COM below with the real apex domain before deploying.
# This matches the app's existing cookie-sharing design (AUTH_COOKIE_DOMAIN
# = .YOUR_DOMAIN.COM), which expects the frontend on the apex/www host and
# the API + WebSocket on the api. subdomain of the *same* parent domain.
# ─────────────────────────────────────────────────────────────────────────

# --- ACME HTTP-01 challenge + HTTP -> HTTPS redirect, all hosts ---
server {
  listen 80;
  server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM api.YOUR_DOMAIN.COM;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# --- Frontend: https://YOUR_DOMAIN.COM / https://www.YOUR_DOMAIN.COM ---
server {
  listen 443 ssl;
  http2 on;
  server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM;

  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    limit_req zone=general burst=40 nodelay;

    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js hot-reload/dev websocket isn't used in production, but
    # keeping upgrade headers here is harmless and future-proof.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

# --- Backend API + Socket.io: https://api.YOUR_DOMAIN.COM ---
server {
  listen 443 ssl;
  http2 on;
  server_name api.YOUR_DOMAIN.COM;

  ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # Socket.io — must come before the general /api location so the upgrade
  # headers are applied to this path specifically. Long-lived connections
  # need generous (not infinite) read/send timeouts, well above Nginx's
  # 60s default, so idle-but-alive sockets don't get dropped.
  location /socket.io/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # REST API
  location / {
    limit_req zone=general burst=40 nodelay;

    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 15m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}

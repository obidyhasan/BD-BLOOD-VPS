user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Query strings are omitted because OAuth codes and sensitive parameters
  # can appear there. Docker captures and rotates stdout/stderr.
  log_format main '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout  65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript
             image/svg+xml;

  # Required for Socket.io / any WebSocket upgrade to be proxied correctly.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Rate limiting zone for a light extra layer in front of the app's own
  # express-rate-limit — mainly protects against a single client hammering
  # Nginx before a request ever reaches Node.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

  include /etc/nginx/conf.d/*.conf;
}

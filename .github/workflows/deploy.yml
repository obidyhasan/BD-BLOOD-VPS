name: Deploy Production

# Deploy ONLY after the CI workflow has completed successfully for the same
# push (docs/CI contract: "a red CI blocks deployment"). The `workflow_run`
# trigger fires on the CI completion event; we gate on conclusion == success.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    environment: production
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # Resolve the commit SHA for both trigger paths.
      - name: Resolve commit SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Until a VPS is provisioned and VPS_* secrets are added, pushes must
      # not fail the pipeline. Secrets can't be read in a job-level `if`, so
      # gate the SSH step instead.
      - name: Check VPS secrets configured
        id: vps
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy (VPS secrets not configured yet)
        if: steps.vps.outputs.configured == 'false'
        run: echo "::notice::VPS secrets not configured — skipping production deploy. Add VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT once the VPS is provisioned."

      - name: Deploy over SSH
        if: steps.vps.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Building three images (api/web/nginx) plus running migrations and
          # health checks on the VPS takes well over the default 10m command
          # timeout, so allow the SSH command to run for up to 30 minutes.
          command_timeout: 30m
          script: |
            set -e
            REPO_DIR="${VPS_REPO_DIR:-/home/deploy/bd-blood}"
            TAG="${{ steps.sha.outputs.TAG }}"

            echo "==> Ensuring repository exists on the VPS (commit: $TAG)"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "==> First run: cloning repository into $REPO_DIR"
              mkdir -p "$(dirname "$REPO_DIR")"
              git clone https://github.com/obidyhasan/BD-BLOOD-VPS.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            echo "==> Refreshing repository on the VPS (commit: $TAG)"
            git fetch --all --prune
            git checkout main
            git reset --hard "$TAG"

            echo "==> Running the single production deploy path"
            IMAGE_TAG="$TAG" bash scripts/deploy-production.sh

            echo "==> Post-deploy container status"
            docker compose --env-file "$REPO_DIR/.env.production" -f "$REPO_DIR/docker-compose.yml" ps

      - name: Mark deployment failure
        if: failure()
        run: echo "Deployment failed — see the GitHub Actions log above for the failing step. Roll back by redeploying the previous commit SHA."

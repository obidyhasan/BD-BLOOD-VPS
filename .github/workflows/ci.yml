name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest
    env:
      # The API config module validates these at import time. DB integration
      # tests self-skip because TEST_DATABASE_URL is intentionally absent —
      # tests never fall back to a production DATABASE_URL (contract-enforced).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      FRONTEND_URL: http://localhost:3000
      RESET_PASSWORD_URL: http://localhost:3000/reset-password
      VERIFY_EMAIL_URL: http://localhost:3000/verify-email
      AUTH_COOKIE_DOMAIN: .localhost
      BCRYPT_SALT_NUMBER: "12"
      ADMIN_BOOTSTRAP_SECRET: ci-only-admin-bootstrap-secret-0000000000
      JWT_ACCESS_SECRET: ci-only-jwt-access-secret-000000000000000000
      JWT_ACCESS_EXPIRES: 1h
      JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret-00000000000000000
      JWT_REFRESH_EXPIRES: 90d
      JWT_PASS_RESET_SECRET: ci-only-jwt-password-reset-secret-0000000
      JWT_PASS_RESET_EXPIRES: 5m
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ci-only-redis-password
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma schema validation
        run: npx prisma validate --config apps/api/prisma.config.ts

      - name: Prisma generate
        run: npm run api:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (web)
        run: npm run lint

      - name: API tests (unit — DB integration tests self-skip)
        run: npm run test --workspace apps/api

  build:
    name: Production builds
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
      NEXT_PUBLIC_SOCKET_URL: https://api.example.com
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build:api

      - name: Build Web (Next.js standalone)
        run: npm run build:web

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t bdblood-api:ci .

      - name: Build Web image
        run: |
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.com/api/v1 \
            --build-arg NEXT_PUBLIC_SOCKET_URL=https://api.example.com \
            --build-arg NEXT_PUBLIC_APP_URL=https://example.com \
            -t bdblood-web:ci .

      - name: Build Nginx reverse-proxy image
        run: docker build infrastructure/nginx -t bdblood-proxy:ci

name: ${COMPOSE_PROJECT_NAME:-bdblood}

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  NODE_ENV: production
  TZ: Asia/Dhaka
  PORT: "5000"
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.production}
  RESET_PASSWORD_URL: ${RESET_PASSWORD_URL:?Set RESET_PASSWORD_URL in .env.production}
  VERIFY_EMAIL_URL: ${VERIFY_EMAIL_URL:?Set VERIFY_EMAIL_URL in .env.production}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?Set AUTH_COOKIE_DOMAIN in .env.production}
  BCRYPT_SALT_NUMBER: ${BCRYPT_SALT_NUMBER:-12}
  ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:?Set ADMIN_BOOTSTRAP_SECRET in .env.production}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.production}
  JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-1h}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
  JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-90d}
  JWT_PASS_RESET_SECRET: ${JWT_PASS_RESET_SECRET:?Set JWT_PASS_RESET_SECRET in .env.production}
  JWT_PASS_RESET_EXPIRES: ${JWT_PASS_RESET_EXPIRES:-5m}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
  MIM_SMS_USERNAME: ${MIM_SMS_USERNAME:-}
  MIM_SMS_API_KEY: ${MIM_SMS_API_KEY:-}
  MIM_SMS_SENDER_NAME: ${MIM_SMS_SENDER_NAME:-}
  MIM_SMS_TRANSACTION_TYPE: ${MIM_SMS_TRANSACTION_TYPE:-T}
  ORGANIZATION_SEED_PHONE: ${ORGANIZATION_SEED_PHONE:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-}
  ADMIN_BLOOD_GROUP: ${ADMIN_BLOOD_GROUP:-O+}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 256mb
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    stop_grace_period: 60s
    logging: *json-logging

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --save 60 1000 --maxmemory ${REDIS_MAXMEMORY:-192mb} --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    stop_grace_period: 20s
    logging: *json-logging

  api:
    image: bdblood-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, data]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  migrate:
    image: bdblood-api:${IMAGE_TAG:-latest}
    environment: *api-environment
    command: ["npm", "run", "migrate:deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    mem_limit: ${MIGRATION_MEMORY_LIMIT:-512m}
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  seed:
    image: bdblood-api:${IMAGE_TAG:-latest}
    profiles: [tools]
    environment: *api-environment
    command: ["node", "dist/app/seed/seed.js"]
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data]
    mem_limit: ${SEED_MEMORY_LIMIT:-768m}
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  worker:
    image: bdblood-api:${IMAGE_TAG:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [data, outbound]
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  web:
    image: bdblood-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?Set NEXT_PUBLIC_SOCKET_URL in .env.production}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env.production}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Asia/Dhaka
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:?Set AUTH_COOKIE_DOMAIN in .env.production}
      INTERNAL_API_URL: http://api:5000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  nginx:
    image: bdblood-proxy:${IMAGE_TAG:-latest}
    build:
      context: infrastructure/nginx
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.production}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.production}
      NGINX_ENVSUBST_FILTER: APP_DOMAIN|API_DOMAIN
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    networks: [edge]
    mem_limit: ${NGINX_MEMORY_LIMIT:-256m}
    stop_grace_period: 20s
    security_opt: [no-new-privileges:true]
    logging: *json-logging

  certbot-init:
    image: certbot/certbot:latest
    profiles: [tools]
    ports:
      - "80:80"
    volumes:
      - certbot_certs:/etc/letsencrypt
    command: ["certonly", "--standalone", "--non-interactive", "--agree-tos", "--no-eff-email", "--email", "${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env.production}", "-d", "${APP_DOMAIN:?Set APP_DOMAIN in .env.production}", "-d", "www.${APP_DOMAIN:?Set APP_DOMAIN in .env.production}", "-d", "${API_DOMAIN:?Set API_DOMAIN in .env.production}"]

  certbot-renew:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: ["renew", "--webroot", "-w", "/var/www/certbot", "--quiet"]

networks:
  edge:
  data:
    internal: true
  outbound:

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_certs:
